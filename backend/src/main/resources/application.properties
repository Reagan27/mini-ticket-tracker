spring.application.name=ticket-tracker

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tickets}
spring.datasource.username=${DB_USER:tickets}
spring.datasource.password=${DB_PASSWORD:tickets}

# Flyway owns the schema; Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

server.port=8080
